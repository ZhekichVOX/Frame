{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Подгруппы{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
    <link rel="icon" href="{% static 'homepage/img/logo.svg' %}" type="image/svg+xml">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="{% url 'homepage:index' %}">
                <img
                    src="{% static 'homepage/img/logo.svg' %}"
                    alt="Подгруппы"
                    class="brand-logo"
                >
                Подгруппы
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            © <span id="current-year">{% now "Y" %}</span>
            Сервис формирования учебных подгрупп
        </div>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
