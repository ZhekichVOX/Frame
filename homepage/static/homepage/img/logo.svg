<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Подгруппы">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- три подгруппы: 3 x 3 точки, поделённые на цветные блоки -->
  <g fill="#ffffff">
    <circle cx="18" cy="18" r="4.5"/><circle cx="32" cy="18" r="4.5"/><circle cx="46" cy="18" r="4.5"/>
  </g>
  <g fill="#a5b4fc">
    <circle cx="18" cy="32" r="4.5"/><circle cx="32" cy="32" r="4.5"/><circle cx="46" cy="32" r="4.5"/>
  </g>
  <g fill="#fcd34d">
    <circle cx="18" cy="46" r="4.5"/><circle cx="32" cy="46" r="4.5"/><circle cx="46" cy="46" r="4.5"/>
  </g>
</svg>
